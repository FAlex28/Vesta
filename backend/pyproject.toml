[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vesta-backend"
version = "0.1.0"
description = "Deterministic safety backend and ElevenLabs voice gateway for Vesta"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.120,<1.0",
    "httpx>=0.28,<1.0",
    "uvicorn[standard]>=0.38,<1.0",
    "pg8000>=1.31,<2.0",
    "python-dotenv>=1.0,<2.0",
    "pywebpush>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "ruff>=0.15,<1.0",
]
raspberry = [
    "gpiozero>=2.0,<3.0",
]

[tool.setuptools.package-data]
"app.db" = ["migrations/*.sql"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: requires external services and explicit credentials",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

